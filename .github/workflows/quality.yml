name: Quality

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile Python scripts and tests
        run: python -m compileall -q scripts tests
      - name: Check command help
        run: |
          python scripts/audit_docx.py --help
          python scripts/extract_pdf_evidence.py --help
      - name: Run temporary PDF and DOCX smoke test
        run: python tests/smoke_test.py
